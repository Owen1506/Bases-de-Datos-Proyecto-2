services:
  # Proyecto 1: instancia con WideWorldImporters completa.
  # La API todavía la usa para clientes, proveedores, inventario, ventas y estadísticas.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_wwi
    hostname: sql_wwi
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
      - "./Script sql:/scripts"

  # Proyecto 2: los tres nodos del sistema distribuido.
  # El hostname debe ser igual al nombre del contenedor: la replicación se conecta por nombre de servidor.
  # El Agent ejecuta los agentes de la replicación.
  # CLAVE_*: contraseñas de los tres nodos, para los scripts de replicación.
  wwi_sanjose:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wwi_sanjose
    hostname: wwi_sanjose
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SANJOSE_PASSWORD}
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
      CLAVE_CORPORATIVO: ${MSSQL_CORPORATIVO_PASSWORD}
      CLAVE_SANJOSE: ${MSSQL_SANJOSE_PASSWORD}
      CLAVE_LIMON: ${MSSQL_LIMON_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - wwi_sanjose_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
      - "./Script sql:/scripts"
    networks:
      - wwi_red

  wwi_limon:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wwi_limon
    hostname: wwi_limon
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_LIMON_PASSWORD}
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
      CLAVE_CORPORATIVO: ${MSSQL_CORPORATIVO_PASSWORD}
      CLAVE_SANJOSE: ${MSSQL_SANJOSE_PASSWORD}
      CLAVE_LIMON: ${MSSQL_LIMON_PASSWORD}
    ports:
      - "1435:1433"
    volumes:
      - wwi_limon_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
      - "./Script sql:/scripts"
    networks:
      - wwi_red

  wwi_corporativo:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wwi_corporativo
    hostname: wwi_corporativo
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_CORPORATIVO_PASSWORD}
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
      CLAVE_CORPORATIVO: ${MSSQL_CORPORATIVO_PASSWORD}
      CLAVE_SANJOSE: ${MSSQL_SANJOSE_PASSWORD}
      CLAVE_LIMON: ${MSSQL_LIMON_PASSWORD}
    ports:
      - "1436:1433"
    volumes:
      - wwi_corporativo_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
      - "./Script sql:/scripts"
    networks:
      - wwi_red

# Los volúmenes y la red de los nodos llevan nombre fijo, igual al que tenían al crearlos con docker run,
# para que docker compose reutilice los datos que ya existan.
volumes:
  sqldata:
  wwi_sanjose_data:
    name: wwi_sanjose_data
  wwi_limon_data:
    name: wwi_limon_data
  wwi_corporativo_data:
    name: wwi_corporativo_data

networks:
  wwi_red:
    name: wwi_red
